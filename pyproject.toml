[project]
name = "hospitality-hackathon-teams-bot"
version = "0.1.0"
description = "A minimal Microsoft Teams echo bot in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dotenv>=0.9.9",
  "microsoft-teams-apps",
]

[dependency-groups]
dev = [
  "pyright>=1.1.406",
]

[project.scripts]
start = "src.main:main"
typecheck = "pyright.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
